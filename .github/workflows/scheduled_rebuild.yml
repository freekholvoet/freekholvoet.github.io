name: Scheduled Site Rebuild

# The talks page splits Upcoming/Past by comparing post.date to site.time,
# which is only recalculated when the site is rebuilt. GitHub Pages rebuilds
# on push, so without a nudge a finished talk stays under "Upcoming".
#
# This used to push an empty commit to force that rebuild, which worked but
# littered the history. Requesting a build through the Pages API does the
# same job without creating any commit.

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4:00 UTC
  workflow_dispatch:      # Allows a manual run from the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
